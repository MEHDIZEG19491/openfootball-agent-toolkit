name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version without v
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  audit:
    uses: ./.github/workflows/security.yml
  draft:
    needs: [verify, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/prepare-release.mjs
      - name: Create draft from reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "v$RELEASE_VERSION"
          "release/openfootball-agent-toolkit-v$RELEASE_VERSION.zip"
          release/SHA256SUMS release/SOURCE-MANIFEST.json
          --target "$GITHUB_SHA" --draft --prerelease
          --title "v$RELEASE_VERSION"
          --notes-file "docs/releases/v$RELEASE_VERSION.md"
