name: Dependency security
on:
  schedule:
    - cron: "21 6 * * 1"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      ["package.json", "package-lock.json", ".github/workflows/security.yml", ".npmrc"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
